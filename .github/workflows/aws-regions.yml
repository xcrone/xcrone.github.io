name: aws-regions

on:
  schedule:
    - cron: '0 0 * * 1' # Mondays 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aws-regions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: python -m unittest discover aws-regions/scripts

      - name: Scrape
        run: python aws-regions/scripts/aws_regions.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- aws-regions/data.json && [ -z "$(git status --porcelain -- aws-regions)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aws-regions/data.json
          git commit -m "chore(aws-regions): weekly update"
          git push
